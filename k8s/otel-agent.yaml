apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent
  namespace: loghouse
data:
  config.yaml: |
    receivers:
      filelog:
        include: [/var/log/pods/loghouse_generator-*/generator/*.log]
        start_at: end
        include_file_path: true
        operators:
          - type: container

          - type: json_parser
            if: 'body matches "^\\{"'
            parse_from: body
            parse_to: attributes

          - type: severity_parser
            if: 'attributes.level != nil'
            parse_from: attributes.level

    processors:
      filter/only_app_logs:
        logs:
          log_record:
            - 'attributes["service"] == nil'

      transform/service_name:
        log_statements:
          - context: log
            statements:
              - set(attributes["service.name"], attributes["service"])

      groupbyattrs/service:
        keys: [service.name]

    exporters:
      otlp:
        endpoint: otel-gateway:4317
        tls:
          insecure: true

    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [filter/only_app_logs, transform/service_name, groupbyattrs/service]
          exporters: [otlp]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: loghouse
spec:
  selector:
    matchLabels:
      app: otel-agent
  template:
    metadata:
      labels:
        app: otel-agent
    spec:
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.130.0
          args: ["--config=/etc/otel/config.yaml"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            - name: pod-logs
              mountPath: /var/log/pods
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: otel-agent
        - name: pod-logs
          hostPath:
            path: /var/log/pods
