apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: keeper
  namespace: loghouse
spec:
  defaults:
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: keeper-data
  configuration:
    clusters:
      - name: main
        layout:
          replicasCount: 3
  templates:
    podTemplates:
      - name: keeper
        spec:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: topology.kubernetes.io/zone
                  labelSelector:
                    matchLabels:
                      clickhouse-keeper.altinity.com/chk: keeper
          containers:
            - name: clickhouse-keeper
              image: clickhouse/clickhouse-keeper:25.8
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
    volumeClaimTemplates:
      - name: keeper-data
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
