apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway
  namespace: loghouse
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        send_batch_size: 10000
        timeout: 5s

    exporters:
      clickhouse:
        endpoint: tcp://clickhouse-loghouse:9000
        database: default
        username: admin
        password: ${env:CLICKHOUSE_PASSWORD}
        logs_table_name: logs_raw
        create_schema: false

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [clickhouse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  namespace: loghouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-gateway
  template:
    metadata:
      labels:
        app: otel-gateway
    spec:
      containers:
        - name: otel-gateway
          image: otel/opentelemetry-collector-contrib:0.130.0
          args: ["--config=/etc/otel/config.yaml"]
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse
                  key: password
          ports:
            - containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/otel
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: otel-gateway
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: loghouse
spec:
  selector:
    app: otel-gateway
  ports:
    - port: 4317
