apiVersion: v1
kind: Namespace
metadata:
  name: loghouse
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: gcp-secret-manager
spec:
  provider:
    gcpsm:
      projectID: loghouse-318a33
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse
  namespace: loghouse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: clickhouse
  data:
    - secretKey: password
      remoteRef:
        key: clickhouse-password
    - secretKey: gcs-access-id
      remoteRef:
        key: gcs-hmac-access-id
    - secretKey: gcs-secret
      remoteRef:
        key: gcs-hmac-secret
